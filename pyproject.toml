[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-object-detection"
dynamic = ["version"]
description = "A real-time computer vision project that uses a webcam and the YOLOv8 model to detect and label objects as they appear on screen, drawing bounding boxes around them using OpenCV."
readme = "README.md"
authors = [{ name = "AP-Abhishek" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.1",
    "opencv-python>=4.13.0.90",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.0",
    "ultralytics>=8.4.8",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
rtod = "main:main"

